<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="208" viewBox="0 0 1200 208" role="img"><title>03 / Сейчас: тестирование, API, конкурентное выполнение. Интересуют стажировки и junior-позиции.</title><rect width="1200" height="208" fill="#000000"/><text x="48" y="37" fill="#eeeeee" font-family="'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="21" letter-spacing="2" xml:space="preserve">03 / IN PROGRESS</text><text x="48" y="84" fill="#c8c8c8" font-family="'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="21" letter-spacing="0" xml:space="preserve">Разбираюсь в тестировании, API и конкурентных задачах.</text><text x="48" y="122" fill="#b8b8b8" font-family="'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="20" letter-spacing="0" xml:space="preserve">В репозиториях — инструкции запуска и известные ограничения.</text><text x="48" y="171" fill="#dddddd" font-family="'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="21" letter-spacing="0" xml:space="preserve">Интересуют стажировки и junior-позиции.</text></svg>